services:
  goravel:
    build:
      context: .
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: image_resizer
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # Object storage for generated outputs (the "s3" disk in
  # config/filesystems.go). Dev-only credentials - see README "Local MinIO
  # for development" for pointing .env at this instead of production MinIO.
  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: creates the "images" bucket and makes it public-read, then
  # exits. Re-running is harmless (mb/anonymous are idempotent). Waits for
  # MinIO's healthcheck (not just "container started") so it doesn't race
  # the server's DNS/listener coming up - see minio.healthcheck above.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 minioadmin minioadmin &&
      mc mb -p localminio/images &&
      mc anonymous set public localminio/images
      "

volumes:
  mysql-data:
  minio-data:
